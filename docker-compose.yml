version: '3.8'

services:
  # Spring Boot Backend Service
  backend-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore-backend
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstoredb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_REDIS_HOST=redis-cache
      - SPRING_REDIS_PORT=6379
    depends_on:
      - postgres-db
      - mysql-db
      - redis-cache
    networks:
      - bookstore-net

  # React Frontend Service
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookstore-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-app
    networks:
      - bookstore-net

  # PostgreSQL Database Container
  postgres-db:
    image: postgres:16-alpine
    container_name: bookstore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookstoredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore-net

  # MySQL Database Container
  mysql-db:
    image: mysql:8.0
    container_name: bookstore-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bookstoredb
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bookstore-net

  # Redis Cache Container
  redis-cache:
    image: redis:7-alpine
    container_name: bookstore-redis
    ports:
      - "6379:6379"
    networks:
      - bookstore-net

  # Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: bookstore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - bookstore-net

  # Grafana Dashboard Server
  grafana:
    image: grafana/grafana:latest
    container_name: bookstore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - bookstore-net

networks:
  bookstore-net:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
