services:
  # Spring Boot Backend API Web Service
  - type: web
    name: bookstore-backend-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: bookstore-postgres-db
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: bookstore-redis-cache
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: redis
          name: bookstore-redis-cache
          property: port

  # React Frontend Free Static Web Application
  - type: static
    name: bookstore-frontend-ui
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bookstore-backend-api
          property: host

  # Redis Cache Service
  - type: redis
    name: bookstore-redis-cache
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: internal-access
    maxmemoryPolicy: allkeys-lru

databases:
  - name: bookstore-postgres-db
    databaseName: bookstoredb
    plan: free
    region: oregon
