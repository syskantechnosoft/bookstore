name: Free Cloud Continuous Deployment (Render)

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Trigger Render Free Cloud Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook (Backend)
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -X POST "$HOOK"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK secret is not set, skipping step."
          fi

      - name: Trigger Render Deploy Hook (Frontend)
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -X POST "$HOOK"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret is not set, skipping step."
          fi
